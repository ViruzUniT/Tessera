name: Build the project Debug Sandbox on Windows
run-name: ${{ github.actor }} Is building the Sandbox
on: [pull_request]
jobs:
  build-the-sandbox:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Same toolchain as local development: llvm-mingw (Clang + libc++, UCRT).
      # The runner's own LLVM targets the MSVC STL, which rejects older Clang versions.
      - name: Cache llvm-mingw
        id: llvm-mingw-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-mingw
          key: llvm-mingw-20260505-ucrt-x86_64

      - name: Install llvm-mingw
        if: steps.llvm-mingw-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $name   = "llvm-mingw-20260505-ucrt-x86_64"
          $url    = "https://github.com/mstorsjo/llvm-mingw/releases/download/20260505/$name.zip"
          $sha256 = "3e6919b3da2b6bfc05d8caf0ab10d5c0be4ddbb873b3c33790a71fe43c09c51f"
          $zip    = "$env:RUNNER_TEMP\$name.zip"

          Invoke-WebRequest $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha256) { throw "llvm-mingw checksum mismatch: $actual" }

          tar -xf $zip -C $env:RUNNER_TEMP
          Rename-Item "$env:RUNNER_TEMP\$name" "llvm-mingw"

      - name: Add llvm-mingw to PATH
        shell: pwsh
        run: |
          "$env:RUNNER_TEMP\llvm-mingw\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Make
        shell: pwsh
        run: |
          choco install make -y

      - name: Verify Make
        shell: pwsh
        run: |
          make --version
      - name: Check compiler
        shell: pwsh
        run: |
          clang++ --version
          where clang++
          where gcc
          where g++
          echo "CC=$env:CC"
          echo "CXX=$env:CXX"

      - name: Install Premake
        shell: pwsh
        run: |
          $version = "5.0.0-beta4"
          $url = "https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-windows.zip"

          Invoke-WebRequest $url -OutFile premake.zip
          Expand-Archive premake.zip -DestinationPath "$env:RUNNER_TEMP\premake"

          "$env:RUNNER_TEMP\premake" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate makefiles
        shell: pwsh
        run: |
          premake5 gen

      - name: Build the project
        shell: pwsh
        run: |
          premake5 build DEBUG

      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sandbox
          path: bin
